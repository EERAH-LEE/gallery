name: deploy

on:
  push: # push(=merge) 됐을 때
    branches: [main] # main에
    paths: ["lab01/infra/*.tf"]  #이거 경로 수정해야함 임의로 넣은거라

permissions:
  contents: read
  id-token: write        

concurrency:
  group: gallery-k0-10.02.lab01-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.7"
  AWS_REGION: "ap-northeast-2"
  WORKING_DIR: "lab01/infra"        #경로적어야함 ex) "ch10/01/lab01/infra"  

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}    

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve   # 변수가 없는 인프라라 input 없어도 괜찮음